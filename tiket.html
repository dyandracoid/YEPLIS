<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<meta name="description" content="Pilih tiket untuk Picnic Music Festival COMMVAGANZA 10.0. Dapatkan tiket terbaikmu sebelum habis!">
<meta name="theme-color" content="#4f46e5">
<meta property="og:title" content="Pilih Tiket - COMMVAGANZA 10.0">
<meta property="og:description" content="Dapatkan tiket terbaikmu untuk Picnic Music Festival COMMVAGANZA 10.0 sebelum habis!">
<title>Pilih Tiket - COMMVAGANZA 10.0</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%234f46e5'/%3E%3Crect x='12' y='21' width='40' height='22' rx='3' fill='%23fff'/%3E%3Ccircle cx='12' cy='32' r='3.5' fill='%234f46e5'/%3E%3Ccircle cx='52' cy='32' r='3.5' fill='%234f46e5'/%3E%3Cline x1='40' y1='23' x2='40' y2='41' stroke='%234f46e5' stroke-width='2.5' stroke-dasharray='3 4'/%3E%3C/svg%3E">
<style>
:root{
--accent:#4f46e5;--accent-deep:#4338ca;--accent-press:#3730a3;--accent-ring:rgba(79,70,229,.14);
--ink:#111827;--body:#374151;--soft:#6b7280;--muted:#9ca3af;
--line:#e5e7eb;--line-strong:#d1d5db;--fill:#f3f4f6;--surface:#f9fafb;--canvas:#f7f8fa;--card:#ffffff;
--green:#047857;--green-tint:#ecfdf5;
--red:#b91c1c;--red-tint:#fef2f2;--red-line:#fecaca;
--bar-h:72px;--bottom-pad:20px;--radius:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
button,input{font-family:inherit}
html{-webkit-tap-highlight-color:transparent}
html,body{background:var(--canvas);color:var(--body);font-family:'Plus Jakarta Sans',Arial,Helvetica,sans-serif;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
body{min-height:100vh}
.app{width:100%;max-width:920px;margin:0 auto;background:var(--card);min-height:100vh;padding-bottom:140px;position:relative;box-shadow:0 0 0 1px rgba(17,24,39,.04),0 12px 40px rgba(17,24,39,.05)}
.topbar{height:var(--bar-h);display:flex;align-items:center;gap:18px;padding:0 36px;background:rgba(255,255,255,.94);backdrop-filter:saturate(150%) blur(14px);-webkit-backdrop-filter:saturate(150%) blur(14px);position:sticky;top:0;z-index:20;border-bottom:1px solid var(--line)}
.back{width:42px;height:42px;border:1px solid var(--line);border-radius:11px;background:var(--card);color:var(--body);cursor:pointer;display:grid;place-items:center;flex:none}
.back:hover{background:var(--fill);border-color:var(--line-strong)}
.back:active{background:var(--line)}
.back svg{width:20px;height:20px}
.topbar h1{font-size:22px;font-weight:800;letter-spacing:-.01em;color:var(--ink)}
.fomo-banner{position:sticky;top:var(--bar-h);z-index:15;background:var(--red-tint);color:var(--red);border-bottom:1px solid var(--red-line);padding:10px 16px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:13px;font-weight:600}
.fomo-icon{width:15px;height:15px;flex:none}
.coupon{padding:14px 36px;font-size:13px;color:var(--soft);display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--card);border-bottom:1px solid var(--line)}
.coupon>svg{width:15px;height:15px;color:var(--muted);flex:none}
.coupon-link{color:var(--accent);font-weight:700;text-decoration:none;border-bottom:1px solid transparent}
.coupon-link:hover{border-bottom-color:var(--accent)}
.coupon-applied{display:inline-flex;align-items:center;gap:8px;background:var(--green-tint);border:1px solid #d1fae5;color:var(--green);padding:5px 6px 5px 12px;border-radius:999px;font-weight:700;font-size:12px}
.coupon-applied>svg{width:14px;height:14px;flex:none}
.coupon-disc{font-weight:800}
.coupon-remove{border:0;background:rgba(4,120,87,.12);color:var(--green);width:20px;height:20px;border-radius:50%;display:grid;place-items:center;cursor:pointer;line-height:1;padding:0}
.coupon-remove:hover{background:#dc2626;color:#fff}
.coupon-remove svg{width:10px;height:10px}
.info-box{margin:22px 36px;padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-radius:12px;display:flex;align-items:center;gap:12px;font-size:13px;line-height:1.55;font-weight:500;color:var(--body)}
.info-icon{width:34px;height:34px;border-radius:9px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;color:var(--accent);flex:none}
.info-icon svg{width:17px;height:17px}
.ticket-list{padding:0 36px;display:flex;flex-direction:column;gap:16px;margin-top:22px}
.ticket-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px;position:relative}
.ticket-card.sold-out{background:var(--surface);border-style:dashed;border-color:var(--line-strong);opacity:.8}
.ticket-card.active{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),0 4px 14px var(--accent-ring)}
.ticket-header{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
.ticket-info h3{font-size:16px;font-weight:700;color:var(--ink);margin-bottom:3px;letter-spacing:-.01em}
.ticket-price{font-size:15px;font-weight:700;color:var(--body)}
.status-badge{padding:4px 10px;border-radius:999px;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;flex:none;display:inline-flex;align-items:center;gap:6px}
.status-sold{background:var(--fill);color:var(--soft)}
.status-available{background:var(--green-tint);color:var(--green)}
.status-available::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--green)}
.quantity-wrapper{margin:20px -20px 0;padding:20px 20px 0;border-top:1px dashed var(--line-strong);position:relative;display:flex;align-items:center;justify-content:space-between}
.ticket-card.active .quantity-wrapper::before,.ticket-card.active .quantity-wrapper::after{content:'';position:absolute;top:-15px;width:30px;height:30px;background:var(--card);border-radius:50%;z-index:10}
.ticket-card.active .quantity-wrapper::before{left:-15px}
.ticket-card.active .quantity-wrapper::after{right:-15px}
.quantity-label{font-size:13px;font-weight:600;color:var(--soft)}
.quantity-controls{display:flex;align-items:center;gap:10px;user-select:none;-webkit-user-select:none}
.qty-btn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--body);cursor:pointer;display:grid;place-items:center}
.qty-btn:hover:not(:disabled){background:var(--fill)}
.qty-btn:active:not(:disabled){background:var(--line)}
.qty-btn:disabled{opacity:.35;cursor:not-allowed}
.qty-btn svg{width:16px;height:16px}
.qty-btn.at-max{background:var(--fill);color:var(--muted)}
.qty-btn.at-max:hover{background:#eceef1}
.qty-number{min-width:32px;text-align:center;font-size:16px;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums}
.bottom{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(920px,100%);background:var(--card);border-top:1px solid var(--line);padding:14px 36px;padding-bottom:var(--bottom-pad);z-index:50;box-shadow:0 -2px 12px rgba(17,24,39,.04)}
.bottom-inner{display:flex;align-items:center;gap:18px}
.summary{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.summary-label{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.summary-amount{font-size:21px;font-weight:800;letter-spacing:-.01em;color:var(--ink);font-variant-numeric:tabular-nums}
.summary-amount.empty{color:var(--muted)}
.summary-note{font-size:12px;font-weight:600;color:var(--green)}
.checkout-btn{flex:none;min-width:190px;height:50px;border:0;border-radius:12px;background:var(--fill);color:var(--muted);font-size:16px;font-weight:800;cursor:not-allowed;font-family:inherit;display:inline-flex;align-items:center;justify-content:center;gap:8px;user-select:none;-webkit-user-select:none}
.checkout-btn.active{background:var(--accent);color:#fff;cursor:pointer}
.checkout-btn.active:hover{background:var(--accent-deep)}
.checkout-btn.active:active{background:var(--accent-press)}
.checkout-btn.busy{pointer-events:none;opacity:.85}
.checkout-btn svg{width:18px;height:18px}
.modal-overlay{position:fixed;inset:0;background:rgba(17,24,39,.45);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:var(--card);border-radius:16px;padding:28px;width:min(420px,100%);box-shadow:0 20px 50px rgba(17,24,39,.2);position:relative}
.modal h3{margin:0 0 6px;font-size:19px;font-weight:800;letter-spacing:-.01em;color:var(--ink)}
.modal p{margin:0 0 18px;font-size:14px;line-height:1.6;color:var(--soft)}
.modal input{width:100%;padding:13px 14px;border:1px solid var(--line-strong);border-radius:10px;font-size:15px;font-weight:600;color:var(--ink);background:var(--card);margin-bottom:16px}
.modal input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-ring)}
.modal input::placeholder{color:var(--muted);font-weight:500}
.modal-close{position:absolute;top:14px;right:14px;width:34px;height:34px;border:0;border-radius:9px;background:var(--fill);color:var(--soft);cursor:pointer;display:grid;place-items:center}
.modal-close:hover{background:var(--red-tint);color:#dc2626}
.modal-close svg{width:17px;height:17px}
.btn-primary{width:100%;border:0;border-radius:12px;background:var(--accent);color:#fff;font-weight:800;cursor:pointer;font-family:inherit;font-size:15px;padding:14px}
.btn-primary:hover{background:var(--accent-deep)}
.btn-primary:active{background:var(--accent-press)}
.toast{position:fixed;left:50%;bottom:104px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 20px;border-radius:10px;font-size:13px;font-weight:600;box-shadow:0 10px 30px rgba(17,24,39,.25);z-index:220;max-width:calc(100vw - 40px);text-align:center}
.noscript-box{margin:16px 36px;padding:13px 16px;background:var(--red-tint);color:var(--red);border:1px solid var(--red-line);border-radius:12px;font-weight:600;font-size:13px;text-align:center}
.back:focus-visible,.coupon-link:focus-visible,.coupon-remove:focus-visible,.qty-btn:focus-visible,.checkout-btn:focus-visible,.btn-primary:focus-visible,.modal-close:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (max-width:600px){
:root{--bar-h:64px;--bottom-pad:16px}
.topbar{padding:0 20px;gap:12px}
.topbar h1{font-size:18px}
.back{width:38px;height:38px}
.back svg{width:18px;height:18px}
.fomo-banner{font-size:12px;padding:9px 14px}
.coupon{padding:12px 20px;font-size:12px}
.info-box{margin:16px 20px;padding:12px 14px;gap:10px;font-size:12px}
.ticket-list{padding:0 20px;gap:14px}
.ticket-card{padding:16px}
.ticket-info h3{font-size:15px}
.quantity-wrapper{margin:16px -16px 0;padding:16px 16px 0}
.bottom{padding:12px 20px}
.bottom-inner{gap:12px}
.summary-label{font-size:10px}
.summary-amount{font-size:17px}
.summary-note{font-size:11px}
.checkout-btn{min-width:140px;height:46px;font-size:15px}
.app{padding-bottom:120px}
.toast{bottom:92px;font-size:12px}
.modal{padding:22px}
.modal h3{font-size:17px}
.noscript-box{margin:14px 20px}
}
@media (max-width:380px){
.bottom-inner{flex-direction:column;align-items:stretch;gap:10px}
.summary{flex-direction:row;align-items:baseline;justify-content:space-between;gap:8px}
.checkout-btn{min-width:0;width:100%}
}
@supports (padding:max(0px)){.bottom{padding-bottom:max(var(--bottom-pad),env(safe-area-inset-bottom))}}
</style>
</head>
<body>
<div class="app">

  <header class="topbar">
    <button class="back" id="backBtn" type="button" aria-label="Kembali ke halaman sebelumnya">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    </button>
    <h1>Pilih Tiket</h1>
  </header>

  <div class="fomo-banner" role="alert">
    <svg class="fomo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
    <span>Sisa tiket terbatas — hanya 9 tiket lagi</span>
  </div>

  <div class="coupon">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12V8H4v4M20 12v4a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-4M20 12h-4a2 2 0 0 0 0 4h4"/></svg>
    <span id="couponDefault">Punya kode kupon? Masukkan <a class="coupon-link" href="#" id="couponLink">di sini</a></span>
    <span class="coupon-applied" id="couponApplied" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="20 6 9 17 4 12"/></svg>
      <strong id="couponName"></strong>
      <span class="coupon-disc" id="couponDisc"></span>
      <button class="coupon-remove" id="couponRemove" type="button" aria-label="Hapus kupon yang diterapkan">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </span>
  </div>

  <div class="info-box">
    <div class="info-icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
    </div>
    <div id="maxInfo">Per akun hanya bisa membeli maksimal 5 tiket.</div>
  </div>

  <section class="ticket-list" id="ticketList" aria-label="Daftar kategori tiket"></section>

  <noscript><div class="noscript-box">Aktifkan JavaScript pada browser kamu untuk memilih dan membeli tiket.</div></noscript>

</div>

<div class="modal-overlay" id="couponModal" role="dialog" aria-modal="true" aria-labelledby="couponTitle" hidden>
  <div class="modal">
    <button class="modal-close" id="couponClose" type="button" aria-label="Tutup dialog kupon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
    <h3 id="couponTitle">Masukkan Kode Kupon</h3>
    <p>Kode kupon akan diverifikasi dan diskonnya diterapkan saat pembayaran.</p>
    <input type="text" id="couponInput" placeholder="Contoh: COMMVAGANZA10" aria-label="Kode kupon" autocomplete="off" maxlength="20">
    <button class="btn-primary" id="couponApply" type="button">Terapkan Kupon</button>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<div class="bottom">
  <div class="bottom-inner">
    <div class="summary">
      <span class="summary-label" id="summaryLabel">Subtotal</span>
      <span class="summary-amount empty" id="summaryAmount">Rp 0</span>
      <span class="summary-note" id="summaryNote" hidden></span>
    </div>
    <button type="button" id="checkoutButton" class="checkout-btn" disabled>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
      <span id="checkoutLabel">Checkout</span>
    </button>
  </div>
</div>

<script>
(()=>{
'use strict';
const MAKS=5;
const tickets=[
{name:'Earlybird',price:90000,status:'sold'},
{name:'Presale 1',price:130000,status:'sold'},
{name:'Presale 2',price:149000,status:'sold'},
{name:'Normal Sale',price:169000,status:'sold'},
{name:'Normal Sale 2',price:199000,status:'available'}
];
const available=tickets.find(t=>t.status==='available');
const COUPONS={COMMVAGANZA10:10,PICNIC2026:15};
const store={
get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},
set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}},
del:k=>{try{localStorage.removeItem(k)}catch(e){}}
};
const formatRupiah=n=>'Rp '+String(n).replace(/\B(?=(\d{3})+(?!\d))/g,'.');

const ticketList=document.getElementById('ticketList');
ticketList.innerHTML=tickets.map(t=>{
const price=formatRupiah(t.price);
if(t.status!=='available'){
return `<article class="ticket-card sold-out" aria-disabled="true"><div class="ticket-header"><div class="ticket-info"><h3>${t.name}</h3><div class="ticket-price">${price}</div></div><span class="status-badge status-sold">Habis</span></div></article>`;
}
return `<article class="ticket-card active" aria-label="${t.name}, ${price}, tersedia"><div class="ticket-header"><div class="ticket-info"><h3>${t.name}</h3><div class="ticket-price">${price}</div></div><span class="status-badge status-available">Tersedia</span></div><div class="quantity-wrapper"><div class="quantity-label" id="qtyLabel">Jumlah Tiket</div><div class="quantity-controls"><button type="button" class="qty-btn" id="minusBtn" aria-label="Kurangi jumlah tiket" aria-describedby="qtyLabel" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/></svg></button><div class="qty-number" id="qtyNumber" aria-live="polite">0</div><button type="button" class="qty-btn" id="plusBtn" aria-label="Tambah jumlah tiket" aria-describedby="maxInfo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button></div></div></article>`;
}).join('');

const qtyNumber=document.getElementById('qtyNumber');
const minusBtn=document.getElementById('minusBtn');
const plusBtn=document.getElementById('plusBtn');
const checkoutButton=document.getElementById('checkoutButton');
const checkoutLabel=document.getElementById('checkoutLabel');
const summaryLabel=document.getElementById('summaryLabel');
const summaryAmount=document.getElementById('summaryAmount');
const summaryNote=document.getElementById('summaryNote');
const toastEl=document.getElementById('toast');
const modal=document.getElementById('couponModal');
const couponInput=document.getElementById('couponInput');
const couponDefault=document.getElementById('couponDefault');
const couponApplied=document.getElementById('couponApplied');
const couponName=document.getElementById('couponName');
const couponDisc=document.getElementById('couponDisc');
const couponClose=document.getElementById('couponClose');
const couponApply=document.getElementById('couponApply');

let jumlahTiket=0;
if(available){
const saved=parseInt(store.get('jumlahTiket'),10);
if(!isNaN(saved)&&saved>0&&saved<=MAKS)jumlahTiket=saved;
}

let toastTimer;
function toast(msg){
toastEl.textContent=msg;
toastEl.hidden=false;
clearTimeout(toastTimer);
toastTimer=setTimeout(()=>{toastEl.hidden=true;},2600);
}

function updateTampilan(){
if(qtyNumber){
qtyNumber.textContent=jumlahTiket;
minusBtn.disabled=jumlahTiket===0;
plusBtn.classList.toggle('at-max',jumlahTiket===MAKS);
}
const total=available?jumlahTiket*available.price:0;
summaryLabel.textContent=jumlahTiket===0?'Subtotal':'Subtotal \u2022 '+jumlahTiket+' tiket';
summaryAmount.textContent=formatRupiah(total);
summaryAmount.classList.toggle('empty',jumlahTiket===0);
checkoutButton.classList.toggle('active',jumlahTiket>=1&&!!available);
checkoutButton.disabled=jumlahTiket<1||!available;
}

if(plusBtn)plusBtn.addEventListener('click',()=>{
if(jumlahTiket>=MAKS){toast('Maksimal pembelian '+MAKS+' tiket per akun');return;}
jumlahTiket++;
updateTampilan();
});
if(minusBtn)minusBtn.addEventListener('click',()=>{
if(jumlahTiket>0){jumlahTiket--;updateTampilan();}
});

function refreshCoupon(){
const code=(store.get('kodeKupon')||'').toUpperCase();
const disc=COUPONS[code];
if(code&&disc){
couponDefault.hidden=true;
couponApplied.hidden=false;
couponName.textContent=code;
couponDisc.textContent='\u2212'+disc+'%';
summaryNote.hidden=false;
summaryNote.textContent='Kupon '+code+' (\u2212'+disc+'%) diterapkan saat pembayaran';
}else{
couponDefault.hidden=false;
couponApplied.hidden=true;
summaryNote.hidden=true;
if(code){store.del('kodeKupon');store.del('diskonKupon');}
}
}

let lastFocus=null;
function openModal(){
lastFocus=document.activeElement;
modal.hidden=false;
document.body.style.overflow='hidden';
couponInput.focus();
}
function closeModal(){
modal.hidden=true;
document.body.style.overflow='';
couponInput.value='';
if(lastFocus&&lastFocus.focus)lastFocus.focus();
}
document.getElementById('couponLink').addEventListener('click',e=>{e.preventDefault();openModal();});
couponClose.addEventListener('click',closeModal);
modal.addEventListener('click',e=>{if(e.target===modal)closeModal();});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!modal.hidden)closeModal();});
modal.addEventListener('keydown',e=>{
if(e.key!=='Tab')return;
const f=[couponClose,couponInput,couponApply];
const first=f[0],last=f[f.length-1];
if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}
else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}
});
function applyCoupon(){
const raw=couponInput.value.trim().toUpperCase();
if(!raw){toast('Masukkan kode kupon terlebih dahulu');couponInput.focus();return;}
const disc=COUPONS[raw];
if(!disc){toast('Kode kupon tidak valid atau kedaluwarsa');couponInput.focus();return;}
store.set('kodeKupon',raw);
store.set('diskonKupon',String(disc));
refreshCoupon();
closeModal();
toast('Kupon '+raw+' berhasil diterapkan \u2014 diskon '+disc+'%');
}
couponApply.addEventListener('click',applyCoupon);
couponInput.addEventListener('keydown',e=>{if(e.key==='Enter')applyCoupon();});
document.getElementById('couponRemove').addEventListener('click',()=>{
store.del('kodeKupon');
store.del('diskonKupon');
refreshCoupon();
toast('Kupon dihapus');
});

let processing=false;
checkoutButton.addEventListener('click',()=>{
if(!available||jumlahTiket<1||processing)return;
processing=true;
checkoutButton.classList.add('busy');
checkoutLabel.textContent='Memproses...';
store.set('jumlahTiket',String(jumlahTiket));
store.set('kategoriTiket',available.name);
store.set('hargaTiket',String(available.price));
window.location.href='form.html';
setTimeout(()=>{processing=false;checkoutButton.classList.remove('busy');checkoutLabel.textContent='Checkout';},2500);
});

document.getElementById('backBtn').addEventListener('click',()=>{
if(window.history.length>1)window.history.back();
else window.location.href='index.html';
});

refreshCoupon();
updateTampilan();
})();
</script>
</body>
</html>
